# Generated for `fly launch` / `fly deploy`. See README.md "Deploy to Fly.io".
# `app` is deliberately named after the user-facing app ("If You Pull, Don't
# Miss"), not the backend repo/namespace (ComicReliefCoreApi) - the container
# and live URL are the public-facing identity, kept separate from the
# backend's own internal name on purpose. `app` and `primary_region` are
# otherwise placeholders — `fly launch` will offer to rewrite this file with
# a unique app name and your chosen region; keep the rest (http_service, vm)
# as-is when it does.
app = "if-you-pull-dont-miss"
primary_region = "iad"

[build]

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  Data__SqlitePath = "/data/comicrelief.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Created once via `fly volumes create comicrelief_data --region iad --size 1` (see
# README.md) - without this, the pull-list database would be wiped every time the
# machine scales back up from zero, since auto_stop_machines discards local disk.
[[mounts]]
  source = "comicrelief_data"
  destination = "/data"
