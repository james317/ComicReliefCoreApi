<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>If You Pull, Don't Miss</title>

  <meta name="theme-color" content="#3a2214" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Don't Miss" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/icons/favicon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="app-header">
    <button id="prevMonth" class="nav-btn" aria-label="Previous month">‹</button>
    <div class="header-title">
      <h1 class="masthead">If You Pull, Don't Miss</h1>
      <p id="monthTitle" class="month-title">Loading…</p>
      <p id="subTitle" class="subtitle"></p>
    </div>
    <button id="nextMonth" class="nav-btn" aria-label="Next month">›</button>
  </header>

  <main id="content" class="content">
    <div id="status" class="status" hidden></div>
    <ul id="comicList" class="comic-list" hidden></ul>
  </main>

  <script src="/app.js"></script>
</body>
</html>
